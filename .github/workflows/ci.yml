name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Run actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install with all optional extras (mcp-middleware, langchain, crewai)
      # so every subpackage -- and its tests -- actually gets exercised, not
      # just the core SDK. There is no Python CLI to test here; the `helix`
      # CLI has a single canonical implementation in helix-sdk-js (see
      # docs/decision-cli-mcp-scope.md in the helixid/helixid repo).
      - name: Install package and dev dependencies
        run: pip install -e ".[dev,all]"

      # tests/test_golden_vectors.py is the cross-language parity safety
      # net; tests/test_delegation_flow_mocked.py exercises the full
      # delegate()/VPBuilder/wallet flow against a mocked HTTP layer;
      # tests/test_framework_adapters.py exercises helix_mcp_middleware/
      # helix_langchain/helix_crewai against the real installed
      # langchain-core and crewai packages (not mocks of them). None of
      # these need network access or a running helix-api instance.
      - name: Test
        run: pytest -v

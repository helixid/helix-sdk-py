name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # There's no direct Python equivalent of changesets, so this uses
  # release-please instead: on every push to main it opens/updates a
  # "chore(main): release X.Y.Z" PR (the Python analogue of helix-core's
  # "Version Packages" PR) that bumps pyproject.toml + src/helix_sdk/
  # __init__.py's __version__ and writes CHANGELOG.md, derived from
  # Conventional Commits since the last release rather than hand-authored
  # changeset files. Nothing is published until that PR is merged, which
  # tags the release and is what the publish job below reacts to.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Requires a PyPI Trusted Publisher configured for this repo/workflow
    # (pypi.org project settings, or a "pending" one before the project
    # exists for the very first publish) targeting this environment name --
    # no PYPI_API_TOKEN secret needed.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

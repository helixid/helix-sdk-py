[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helixid-sdk-py"
version = "0.1.0"
description = "Python SDK for HelixID -- decentralized agent identity via DID/VC."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "DgVerse LLP" }]
dependencies = [
    "pynacl>=1.5,<2.0",
    "cryptography>=41.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "langchain-core>=0.3; python_version >= '3.10'",
    "crewai>=1.0; python_version >= '3.10'",
]
cli = [
    "click>=8.1",
]
mcp = [
    "mcp>=1.9,<2",
]
langchain = [
    "langchain-core>=0.3; python_version >= '3.10'",
]
crewai = [
    "crewai>=1.0; python_version >= '3.10'",
]
all = [
    "click>=8.1",
    "mcp>=1.9,<2",
    "langchain-core>=0.3; python_version >= '3.10'",
    "crewai>=1.0; python_version >= '3.10'",
]

[project.scripts]
helix = "helix_cli.cli:main"

[project.urls]
Homepage = "https://github.com/helixid/helix-sdk-py"
Repository = "https://github.com/helixid/helix-sdk-py"

[tool.setuptools.packages.find]
where = ["src"]

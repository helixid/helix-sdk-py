[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helixid-sdk-py"
version = "0.1.0"
description = "Python SDK for HelixID -- decentralized agent identity via DID/VC."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "DgVerse LLP" }]
dependencies = [
    "pynacl>=1.5,<2.0",
    "cryptography>=41.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "langchain-core>=0.3; python_version >= '3.10'",
    "crewai>=1.0; python_version >= '3.10'",
]
mcp-middleware = [
    "mcp>=1.9,<2; python_version >= '3.10'",
]
langchain = [
    "langchain-core>=0.3; python_version >= '3.10'",
]
crewai = [
    "crewai>=1.0; python_version >= '3.10'",
]
all = [
    "mcp>=1.9,<2; python_version >= '3.10'",
    "langchain-core>=0.3; python_version >= '3.10'",
    "crewai>=1.0; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/helixid/helix-sdk-py"
Repository = "https://github.com/helixid/helix-sdk-py"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
helix_sdk = ["py.typed"]
helix_langchain = ["py.typed"]
helix_crewai = ["py.typed"]
helix_mcp_middleware = ["py.typed"]

[tool.pytest.ini_options]
addopts = [
    "--cov=helix_sdk",
    "--cov=helix_langchain",
    "--cov=helix_crewai",
    "--cov=helix_mcp_middleware",
    "--cov-branch",
    "--cov-report=term-missing",
]

[tool.coverage.report]
# Measured baseline as of 2026-09-03 (63% overall) -- this gate exists to
# catch regressions, not because 60% is a target. helix-sdk-js/helix-api
# enforce 90% lines / 90% statements / 85% branches / 90% functions; closing
# this gap toward that is real follow-up work, tracked separately from
# wiring up the tooling itself. Some modules (did.py) currently have no
# direct unit tests at all -- see the coverage report's per-file breakdown.
fail_under = 60
